name: CI

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

# `contents: write` lets the release job publish a GitHub Release + attach the APK.
permissions:
  contents: write

jobs:
  build:
    name: Build debug APK (branch commit)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Ensure the AdvancedLocation submodule is at daktak/AdvancedLocation master
      # (the gitlink recorded in this repo points at master; this step guarantees
      # it on CI even if the working tree is detached differently).
      - name: Verify submodule is at daktak/AdvancedLocation master
        run: |
          cd submodules/AdvancedLocation
          test -f build.gradle
          echo "Submodule commit: $(git rev-parse HEAD)"

      # Run Gradle on JDK 21: io.rebble.pebblekit2:client:1.2.0 ships Java 21
      # (class 65.0) bytecode, so kapt (under JDK 17) can't read it. Source/target
      # stay 17 (Android's AGP 8.7 max).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Create release (on v* tags)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # No signing config exists in app/build.gradle, so this produces an
      # unsigned APK (app-release-unsigned.apk). Safe to verify/publish from CI.
      - name: Build release APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK artifact
        id: apk
        run: |
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            "${{ steps.apk.outputs.path }}"
