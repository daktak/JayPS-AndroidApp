plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    namespace "com.njackson"
    compileSdk 34

    // Legacy instrumentation tests still use android.test.AndroidTestCase /
    // InstrumentationTestRunner, which AGP 8 no longer puts on the compile classpath.
    useLibrary 'android.test.base'
    useLibrary 'android.test.runner'

    defaultConfig {
        applicationId "com.njackson"
        minSdk 24
        targetSdk 34
        versionCode 500
        versionName "v26.8.0"
        testInstrumentationRunner "com.njackson.test.MyInstrumentationTestRunner"
    }

    lintOptions {
        abortOnError false
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            zipAlignEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.core:core:1.13.1'
    }
}

dependencies {
    implementation project(':advancedlocation-library')

    // Modern Pebble communication (replaces the abandoned com.getpebble:pebblekit)
    implementation 'io.rebble.pebblekit2:client:1.2.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.20'

    // Event bus
    implementation 'com.squareup:otto:1.3.8'

    // Dagger 2
    implementation 'com.google.dagger:dagger:2.60.1'
    kapt 'com.google.dagger:dagger-compiler:2.60.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment:1.8.5'

    // Location (Activity Recognition + FusedLocationProviderClient)
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Changelog dialog (de.cketti.library.changelog)
    implementation 'de.cketti.library.changelog:ckchangelog:1.2.2'

    // RxJava 1 (used by ServiceStarter / MainServiceStatusObservable)
    implementation 'io.reactivex:rxjava:1.3.8'

    androidTestImplementation 'com.google.dexmaker:dexmaker:1.1+'
    androidTestImplementation 'com.google.dexmaker:dexmaker-mockito:1.1+'
    androidTestImplementation 'org.mockito:mockito-core:1.10.19'
}
